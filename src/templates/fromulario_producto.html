<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <h1>{{ titulo }}</h1>

    <form action="{{ url_for('guardar_producto') }}" method="POST">
        <!-- Si se está editando, incluye el ID oculto -->
        {% if producto %}
            <input type="hidden" name="id" value="{{ producto['id'] }}">
        {% endif %}

        <label for="nombre">Nombre del producto:</label>
        <input type="text" name="nombre" id="nombre" required
               value="{{ producto['nombre'] if producto else '' }}">

        <label for="precio">Precio:</label>
        <input type="number" name="precio" id="precio" step="0.01" required
               value="{{ producto['precio'] if producto else '' }}">

        <label for="stock">Cantidad en stock:</label>
        <input type="number" name="stock" id="stock" required
               value="{{ producto['stock'] if producto else '' }}">

        <button type="submit">Guardar</button>
    </form>

    <a href="{{ url_for('productos') }}">Volver a la lista de productos</a>
</body>
</html>
